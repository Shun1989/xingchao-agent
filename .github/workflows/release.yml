name: Windows signed stable candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-signed-stable-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  windows-x64:
    name: Build signed Windows x64 candidate
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate stable version and signing secrets
        id: version
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version '$version' is not a stable X.Y.Z version. Update it in a reviewed commit before building a stable candidate."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "Signed candidate setup is incomplete. Add repository secrets WIN_CSC_LINK (publisher PFX as base64, file path, or URL accepted by electron-builder) and WIN_CSC_KEY_PASSWORD, then dispatch this workflow again. Unsigned candidates are intentionally rejected."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install locked dependencies
        shell: pwsh
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          OO_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm.cmd install --frozen-lockfile

      - name: Lint
        shell: pwsh
        run: pnpm.cmd run lint

      - name: Type check
        shell: pwsh
        run: pnpm.cmd run ts-check

      - name: Check formatting
        shell: pwsh
        run: pnpm.cmd run format

      - name: Run tests
        shell: pwsh
        run: pnpm.cmd run test

      - name: Build application
        shell: pwsh
        run: pnpm.cmd run build:app

      - name: Prepare packaged runtimes
        shell: pwsh
        run: pnpm.cmd run prepare:binaries

      - name: Package signed Windows x64 installer without publishing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          XINGCHAO_REQUIRE_CODE_SIGNING: "true"
        run: pnpm.cmd exec electron-builder --win nsis --x64 --publish never

      - name: Collect release size metadata
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --experimental-strip-types scripts/release-size.ts collect `
            --platform win32 `
            --arch x64 `
            --version $env:VERSION `
            --release-dir "release/$env:VERSION" `
            --out "release/$env:VERSION/release-size-win32-x64.json"

      - name: Verify signatures and stage candidate
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "release/$env:VERSION"
          $installer = Join-Path $releaseDir "星潮航局-$env:VERSION-Setup.exe"
          $blockmap = "$installer.blockmap"
          $metadata = Join-Path $releaseDir "latest.yml"
          $appExecutable = Join-Path $releaseDir "win-unpacked/星潮航局.exe"

          foreach ($required in @($installer, $blockmap, $metadata, $appExecutable)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required release output is missing: $required"
            }
          }

          $updateJson = node -e "const fs=require('node:fs');const yaml=require('js-yaml');const d=yaml.load(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(JSON.stringify({version:d.version,path:d.path,url:d.files?.[0]?.url}))" $metadata
          $update = $updateJson | ConvertFrom-Json
          if ($update.version -ne $env:VERSION) {
            throw "latest.yml version '$($update.version)' does not match package version '$env:VERSION'."
          }
          if ([string]::IsNullOrWhiteSpace($update.path) -or $update.path -ne $update.url) {
            throw "latest.yml must contain one consistent installer path/url."
          }
          $publishedInstallerName = [string]$update.path
          if ([IO.Path]::GetFileName($publishedInstallerName) -ne $publishedInstallerName) {
            throw "latest.yml installer path must be a file name, got '$publishedInstallerName'."
          }

          $signatureRecords = foreach ($target in @($installer, $appExecutable)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode verification failed for '$target': $($signature.Status) $($signature.StatusMessage)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode timestamp verification failed for '$target': no timestamp certificate is present."
            }
            [pscustomobject]@{ Path = $target; Signature = $signature }
          }
          $thumbprints = @($signatureRecords | ForEach-Object { $_.Signature.SignerCertificate.Thumbprint } | Sort-Object -Unique)
          if ($thumbprints.Count -ne 1) {
            throw "Installer and unpacked executable were not signed by the same publisher certificate."
          }

          $candidateDir = Join-Path $PWD "candidate/windows-x64"
          $noticesDir = Join-Path $candidateDir "notices"
          New-Item -ItemType Directory -Path $noticesDir -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $candidateDir $publishedInstallerName)
          Copy-Item -LiteralPath $blockmap -Destination (Join-Path $candidateDir "$publishedInstallerName.blockmap")
          Copy-Item -LiteralPath $metadata -Destination (Join-Path $candidateDir "latest.yml")
          $candidateSizeMetadata = Join-Path $candidateDir "release-size-win32-x64.json"
          Copy-Item -LiteralPath (Join-Path $releaseDir "release-size-win32-x64.json") -Destination $candidateSizeMetadata
          node --experimental-strip-types scripts/release-size.ts stage `
            --metadata-file $candidateSizeMetadata `
            --artifact-dir $candidateDir `
            --from-file ([IO.Path]::GetFileName($installer)) `
            --to-file $publishedInstallerName
          foreach ($notice in @("LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "TRADEMARKS.md")) {
            Copy-Item -LiteralPath $notice -Destination $noticesDir
          }

          $installerSignature = $signatureRecords[0].Signature
          @(
            "Release candidate signing status"
            "Overall: Authenticode Valid"
            "Verified targets: installer and unpacked application executable"
            "Certificate subject: $($installerSignature.SignerCertificate.Subject)"
            "Certificate thumbprint: $($installerSignature.SignerCertificate.Thumbprint)"
            "Timestamp verification: Present on installer and unpacked application executable"
            "Verification time (UTC): $([DateTime]::UtcNow.ToString('O'))"
          ) | Set-Content -LiteralPath (Join-Path $candidateDir "SIGNING-STATUS.txt") -Encoding utf8

          $checksumPath = Join-Path $candidateDir "SHA256SUMS.txt"
          Get-ChildItem -LiteralPath $candidateDir -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($candidateDir, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Run packaged Windows smoke
        shell: pwsh
        run: node --experimental-strip-types scripts/windows-packaged-smoke.ts

      - name: Upload signed candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: xingchao-navigation-${{ steps.version.outputs.version }}-windows-x64-signed-candidate
          path: candidate/windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
